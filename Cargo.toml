[package]
name = "soundpad"
version = "0.1.0"
edition = "2024"
description = "Minimal Soundpad-style sound board for macOS"
license = "GPL-3.0-only"
repository = "https://github.com/bynarig/soundpad"

[lib]
# rlib for tests/CLI, staticlib for the SwiftUI app (macos/).
crate-type = ["rlib", "staticlib"]

[dependencies]
cpal = "0.18"
symphonia = { version = "0.6", features = ["all"] }
global-hotkey = "0.10"
ringbuf = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
crossbeam-channel = "0.5"
parking_lot = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Audio code must be fast even in debug builds or it will glitch.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
